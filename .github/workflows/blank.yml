name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Gus444
          outputs: |
            dist/github-snake.svg?color_snake=#39ff14&color_dots=#0a0f0d,#1a3b2f,#2e7d32,#4caf50,#8bc34a
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake.gif?color_snake=#ff6b6b&color_dots=#4a4e69,#6c757d,#9a8c98,#c9ada7,#f2e9e4&color_background=#0d1117

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update snake animation"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
